<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Акты Совета Безопасности Российской Федерации</title>
  <link rel="icon" type="image/png" href="ikon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://static.tildacdn.com">
  <link rel="stylesheet" href="https://static.tildacdn.com/css/tilda-fonts-1.0.min.css">
  <style>
    .sb-list { list-style: none; margin: 0; padding: 0; }
    .sb-item { padding: 24px 0; border-bottom: 1px solid #e8e8e8; }
    .sb-item:first-child { padding-top: 0; }
    .sb-item:last-child { border-bottom: none; padding-bottom: 0; }
    .sb-item__title { font-size: 22px; font-weight: 700; color: #111; margin: 0 0 10px; line-height: 1.3; letter-spacing: 0.01em; text-transform: uppercase; }
    .sb-item__date { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: #666; margin: 0 0 10px; line-height: 1.4; }

    .dyn-pub { padding: 24px 0; border-bottom: 1px solid #e8e8e8; position: relative; }
    .dyn-pub:first-child { padding-top: 0; }
    .dyn-pub:last-child { border-bottom: none; padding-bottom: 0; }
    .dyn-pub__link { display: block; color: inherit; text-decoration: none; padding-right: 44px; transition: opacity 0.2s ease; }
    .dyn-pub__link:hover { opacity: 0.75; }
    .dyn-pub__title { font-size: 22px; font-weight: 700; color: #111; margin: 0 0 10px; line-height: 1.3; letter-spacing: 0.01em; text-transform: uppercase; }
    .dyn-pub__date { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: #666; margin: 0 0 10px; line-height: 1.4; }
    .dyn-pub__date svg { color: #c9a24a; flex-shrink: 0; }
    .dyn-pub__desc { font-size: 16px; color: #333; margin: 0; line-height: 1.6; }
    .dyn-pub__delete { position: absolute; top: 24px; right: 0; width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1px solid #e0b5b3; color: #c9302c; cursor: pointer; display: none; align-items: center; justify-content: center; padding: 0; z-index: 2; }
    .dyn-pub__delete.is-visible { display: inline-flex; }
    .dyn-pub__delete:hover { background: #c9302c; color: #fff; }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="site-header__menu">
      <a href="fz.html" class="site-header__link">Федеральное законодательство</a>
      <a href="gos.html" class="site-header__link">Государственное руководство</a>
      <a href="akty.html" class="site-header__link is-current">Акты</a>
    </nav>
    <a href="index.html" class="site-header__title">Moscow RP</a>
    <a href="https://discord.gg/Rw82hSQfhw" target="_blank" rel="noopener" class="site-header__discord" title="Discord" aria-label="Discord">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/>
      </svg>
    </a>
  </header>

  <main class="page">
    <header class="page__head">
      <h1 class="page__title">Акты Совета Безопасности Российской Федерации</h1>
      <p class="page__subtitle">Нормативные правовые акты, изданные Советом Безопасности Российской Федерации</p>
    </header>

    <div id="newPublicationBlock" style="display:none;margin-bottom:28px;">
      <a href="add-publication.html?section=sb" style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:#c9302c;color:#fff;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Новая публикация
      </a>
    </div>

    <ul class="sb-list" id="sbList"></ul>
  </main>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const SECTION = 'sb';
    const listEl = document.getElementById('sbList');
    let currentRole = 'citizen';

    loadPublications();

    async function loadPublications() {
      try {
        const q = query(collection(db, 'publications'), where('section', '==', SECTION));
        const snap = await getDocs(q);
        if (snap.empty) return;
        const items = [];
        snap.forEach((d) => items.push({ id: d.id, data: d.data() }));
        items.sort((a, b) => (b.data.createdAt?.toMillis?.() || 0) - (a.data.createdAt?.toMillis?.() || 0));
        listEl.innerHTML = items.map(renderItem).join('');
        updateDeleteBtns();
      } catch (err) { console.error(err); }
    }

    function renderItem(item) {
      const d = item.data;
      return `
        <li class="dyn-pub" data-doc-id="${item.id}">
          <button class="dyn-pub__delete" type="button" data-id="${item.id}" data-title="${esc(d.title)}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <a class="dyn-pub__link" href="publication.html?id=${item.id}">
            <h2 class="dyn-pub__title">${esc(d.title || 'Без названия')}</h2>
            <p class="dyn-pub__date">
              <svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><path d="M3 0h6l3 3v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5 1v3h3L8 1z"/></svg>
              <span>${formatDate(d.createdAt)}</span>
            </p>
            ${d.subtitle ? `<p class="dyn-pub__desc">${esc(d.subtitle)}</p>` : ''}
          </a>
        </li>`;
    }

    onAuthStateChanged(auth, async (user) => {
      const block = document.getElementById('newPublicationBlock');
      if (user) {
        try {
          const t = await user.getIdTokenResult();
          currentRole = t.claims.role || 'citizen';
        } catch (e) {}
      }
      if (block) block.style.display = (currentRole === 'government' || currentRole === 'editor') ? 'block' : 'none';
      updateDeleteBtns();
    });

    function updateDeleteBtns() {
      const show = currentRole === 'government';
      document.querySelectorAll('.dyn-pub__delete').forEach((btn) => {
        btn.classList.toggle('is-visible', show);
        btn.onclick = (e) => {
          e.preventDefault(); e.stopPropagation();
          const id = btn.getAttribute('data-id');
          if (id) handleDelete(id, btn.getAttribute('data-title'));
        };
      });
    }

    async function handleDelete(docId, title) {
      if (!confirm('Удалить публикацию?\n\n«' + title + '»\n\nДействие необратимо.')) return;
      try {
        await deleteDoc(doc(db, 'publications', docId));
        document.querySelector('.dyn-pub[data-doc-id="' + docId + '"]')?.remove();
      } catch (err) { alert('Ошибка: ' + err.message); }
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear() + ' года';
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
</body>
</html>
