  <style>
    .org-page { max-width: 1100px; margin: 0 auto; }

    .org-page__head {
      display: flex; gap: 28px; align-items: center;
      padding: 28px 32px; background: #fff;
      border: 1px solid #e8e8e8; border-radius: 16px;
      margin-bottom: 28px; box-shadow: 0 6px 24px rgba(0,0,0,0.05);
    }
    .org-page__logo {
      width: 110px; height: 110px; border-radius: 16px;
      overflow: hidden; flex-shrink: 0; background: #f7f7f7;
      border: 2px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex; align-items: center; justify-content: center;
    }
    .org-page__logo img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
    .org-page__short {
      font-size: 30px; font-weight: 800; color: #111;
      margin: 0 0 6px; letter-spacing: 0.02em; text-transform: uppercase;
    }
    .org-page__name { font-size: 15px; color: #666; margin: 0 0 12px; }
    .org-page__desc { font-size: 15px; color: #333; line-height: 1.6; margin: 0 0 14px; }
    .org-page__head-info { display: flex; gap: 32px; flex-wrap: wrap; }
    .org-page__head-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .org-page__head-name { font-size: 15px; color: #111; font-weight: 700; }
    .org-page__head-rank { font-size: 13px; color: #666; font-style: italic; margin-top: 2px; }

    .org-tabs {
      display: flex; gap: 4px; border-bottom: 1px solid #e8e8e8;
      margin-bottom: 24px; overflow-x: auto;
    }
    .org-tab {
      padding: 14px 22px; font-size: 15px; font-weight: 600; color: #666;
      text-decoration: none; border-bottom: 3px solid transparent;
      white-space: nowrap; cursor: pointer;
      background: none; border-top: none; border-left: none; border-right: none;
      font-family: inherit;
      transition: color .15s ease, border-color .15s ease;
    }
    .org-tab:hover { color: #111; }
    .org-tab.is-active { color: #c9302c; border-bottom-color: #c9302c; }

    .org-panel { display: none; }
    .org-panel.is-active { display: block; }
    .org-panel__empty { text-align: center; color: #999; padding: 60px 0; font-size: 15px; }

    .org-panel__list { list-style: none; margin: 0; padding: 0; }
    .org-pub { padding: 22px 0; border-bottom: 1px solid #eee; position: relative; }
    .org-pub:first-child { padding-top: 0; }
    .org-pub:last-child { border-bottom: none; padding-bottom: 0; }
    .org-pub__link { display: block; color: inherit; text-decoration: none; transition: opacity .15s ease; }
    .org-pub__link:hover { opacity: 0.75; }
    .org-pub__title { font-size: 20px; font-weight: 700; color: #111; margin: 0 0 8px; line-height: 1.3; }
    .org-pub__date { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #666; margin: 0 0 8px; }
    .org-pub__date svg { color: #c9a24a; flex-shrink: 0; }
    .org-pub__desc { font-size: 15px; color: #333; margin: 0; line-height: 1.6; }

    .org-toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .org-toolbar__back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; color: #666; text-decoration: none;
    }
    .org-toolbar__back:hover { color: #111; }
    .org-toolbar__new {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: #c9302c; color: #fff;
      border-radius: 8px; font-weight: 600; font-size: 13px; text-decoration: none;
    }
    .org-toolbar__new:hover { background: #a82822; }

    @media (max-width: 640px) {
      .org-page__head { flex-direction: column; text-align: center; padding: 22px; }
      .org-page__head-info { justify-content: center; }
      .org-page__short { font-size: 22px; }
    }
  </style>
</head>
<body>

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>

  <main class="page">
    <div class="org-toolbar">
      <a href="organizations.html" class="org-toolbar__back">← Все организации</a>
      <a href="#" class="org-toolbar__new" id="newPubLink" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Новая публикация
      </a>
    </div>

    <div class="org-page" id="orgPage">
      <p style="text-align:center;color:#888;padding:40px 0;">Загрузка организации…</p>
    </div>
  </main>

  <script type="module" src="js/auth-header.js?v=22"></script>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { canEdit, getClaims } from "./js/permissions.js";

    const params = new URLSearchParams(window.location.search);
    const orgId = params.get('id');

    const orgPageEl = document.getElementById('orgPage');
    const newPubLink = document.getElementById('newPubLink');

    let currentClaims = { role: 'citizen', sections: [] };
    let currentTab = null;
    let TABS = [];
    let CURRENT_ORG_SECTION = '';

    const DEFAULT_TABS = [
      { label: 'Пресс-служба',     section: 'press' },
      { label: 'Акты',             section: 'acts' },
      { label: 'Нормативные акты', section: 'normative' }
    ];

    if (!orgId) {
      orgPageEl.innerHTML = '<p style="text-align:center;color:#b3261e;padding:40px 0;">Организация не найдена.</p>';
    } else {
      loadOrg();
    }

    async function loadOrg() {
      try {
        const ref = doc(db, 'organizations', orgId);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          orgPageEl.innerHTML = '<p style="text-align:center;color:#b3261e;padding:40px 0;">Организация не найдена.</p>';
          return;
        }
        const d = snap.data();

        // Запоминаем короткий раздел организации — по нему будем проверять права
        CURRENT_ORG_SECTION = d.section || '';

        const rawTabs = Array.isArray(d.tabs) && d.tabs.length ? d.tabs : DEFAULT_TABS;
        TABS = rawTabs.map(t => ({
          label: t.label,
          key: t.section,
          section: 'org-' + orgId + '-' + t.section
        }));

        currentTab = TABS[0].key;
        renderOrg(d);
        loadTab(currentTab);
      } catch (e) {
        console.error(e);
        orgPageEl.innerHTML = '<p style="text-align:center;color:#b3261e;padding:40px 0;">Ошибка загрузки.</p>';
      }
    }

    function renderOrg(d) {
      orgPageEl.innerHTML = `
        <div class="org-page__head">
          <div class="org-page__logo">
            <img src="${esc(d.logoUrl || '')}" alt="${esc(d.shortName || '')}" loading="lazy">
          </div>
          <div style="flex:1;">
            <h1 class="org-page__short">${esc(d.shortName || '')}</h1>
            <p class="org-page__name">${esc(d.name || '')}</p>
            <p class="org-page__desc">${esc(d.description || '')}</p>
            <div class="org-page__head-info">
              <div>
                <div class="org-page__head-label">${esc(d.headPosition || 'Руководитель')}</div>
                <div class="org-page__head-name">${esc(d.head || '')}</div>
                <div class="org-page__head-rank">${esc(d.headRank || '')}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="org-tabs" id="orgTabs">
          ${TABS.map(t => `<button class="org-tab${t.key === currentTab ? ' is-active' : ''}" data-tab="${esc(t.key)}">${esc(t.label)}</button>`).join('')}
        </div>

        ${TABS.map(t => `<div class="org-panel${t.key === currentTab ? ' is-active' : ''}" id="panel-${esc(t.key)}"><p class="org-panel__empty">Загрузка…</p></div>`).join('')}
      `;

      document.getElementById('orgTabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.org-tab');
        if (!btn) return;
        const tab = btn.getAttribute('data-tab');
        if (!tab || tab === currentTab) return;
        currentTab = tab;
        document.querySelectorAll('.org-tab').forEach(t => t.classList.toggle('is-active', t.getAttribute('data-tab') === tab));
        document.querySelectorAll('.org-panel').forEach(p => p.classList.toggle('is-active', p.id === 'panel-' + tab));
        loadTab(tab);
        updateNewPubLink();
      });

      updateNewPubLink();
    }

    function updateNewPubLink() {
      if (!newPubLink) return;
      const tab = TABS.find(t => t.key === currentTab);
      if (!tab) {
        newPubLink.style.display = 'none';
        return;
      }

      // Разрешаем публиковать, если:
      //   1) у пользователя есть права на раздел организации (org.section) — например, mvd → mvd
      //   2) ИЛИ на конкретную вкладку (org-{id}-{tab})
      const allowed = (CURRENT_ORG_SECTION && canEdit(CURRENT_ORG_SECTION, currentClaims))
                   || canEdit(tab.section, currentClaims);

      newPubLink.style.display = allowed ? 'inline-flex' : 'none';
      if (allowed) newPubLink.href = 'add-publication.html?section=' + tab.section;
    }

    async function loadTab(tabKey) {
      const tab = TABS.find(t => t.key === tabKey);
      if (!tab) return;
      const panel = document.getElementById('panel-' + tabKey);
      panel.innerHTML = '<p class="org-panel__empty">Загрузка…</p>';

      try {
        const q = query(collection(db, 'publications'), where('section', '==', tab.section));
        const snap = await getDocs(q);
        if (snap.empty) {
          panel.innerHTML = '<p class="org-panel__empty">Пока нет публикаций в этом разделе.</p>';
          return;
        }
        const items = [];
        snap.forEach(d => items.push({ id: d.id, data: d.data() }));
        items.sort((a, b) => (b.data.createdAt?.toMillis?.() || 0) - (a.data.createdAt?.toMillis?.() || 0));
        panel.innerHTML = '<ul class="org-panel__list">' + items.map(renderPub).join('') + '</ul>';
      } catch (e) {
        console.error(e);
        panel.innerHTML = '<p class="org-panel__empty" style="color:#b3261e;">Ошибка загрузки.</p>';
      }
    }

    function renderPub(item) {
      const d = item.data;
      return `
        <li class="org-pub">
          <a class="org-pub__link" href="publication.html?id=${item.id}">
            <h2 class="org-pub__title">${esc(d.title || 'Без названия')}</h2>
            <p class="org-pub__date">
              <svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor"><path d="M3 0h6l3 3v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5 1v3h3L8 1z"/></svg>
              <span>${formatDate(d.createdAt)}</span>
            </p>
            ${d.subtitle ? `<p class="org-pub__desc">${esc(d.subtitle)}</p>` : ''}
          </a>
        </li>`;
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear() + ' года';
    }
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    onAuthStateChanged(auth, async (user) => {
      currentClaims = await getClaims(user);
      updateNewPubLink();
    });
  </script>
</body>
