  <script type="module" src="js/auth-header.js?v=22"></script>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const pubId = params.get('id');

    const titleEl = document.getElementById('pubTitle');
    const subtitleEl = document.getElementById('pubSubtitle');
    const metaEl = document.getElementById('pubMeta');
    const imageEl = document.getElementById('pubImage');

    if (!pubId) {
      titleEl.textContent = 'Публикация не найдена';
    } else {
      loadPublication();
    }

    async function loadPublication() {
      try {
        const snap = await getDoc(doc(db, 'publications', pubId));
        if (!snap.exists()) {
          titleEl.textContent = 'Публикация не найдена';
          return;
        }
        const pub = snap.data();

        titleEl.textContent = pub.title || 'Без названия';
        subtitleEl.textContent = pub.subtitle || '';
        metaEl.textContent = formatDate(pub.createdAt) + (pub.author ? ' · ' + pub.author : '');
        imageEl.src = pub.imageUrl || '';
        imageEl.alt = pub.title || '';
      } catch (e) {
        console.error(e);
        titleEl.textContent = 'Ошибка загрузки';
      }
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear() + ' года';
    }
  </script>
