  <style>
    .auth-form {
      max-width: 420px; margin: 0 auto; padding: 32px 28px;
      background: #fafafa; border: 1px solid #e8e8e8; border-radius: 12px;
    }
    .auth-form__title {
      font-size: 22px; font-weight: 700; color: #111;
      margin: 0 0 24px; text-align: center;
    }
    .auth-form__field { margin-bottom: 16px; }
    .auth-form__label {
      display: block; font-size: 14px; color: #555; margin-bottom: 6px;
    }
    .auth-form__input {
      width: 100%; padding: 12px 14px; font-size: 15px;
      border: 1px solid #d8d8d8; border-radius: 8px;
      outline: none; box-sizing: border-box;
      font-family: inherit; transition: border-color 0.2s ease;
    }
    .auth-form__input:focus { border-color: #c9a24a; }
    .auth-form__btn {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 600;
      color: #fff; background: #c9a24a; border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit; transition: opacity 0.2s ease;
      margin-top: 8px;
    }
    .auth-form__btn:hover { opacity: 0.85; }
    .auth-form__btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-form__message {
      margin-top: 16px; padding: 12px 14px; font-size: 14px;
      border-radius: 8px; display: none;
    }
    .auth-form__message.is-error {
      display: block; background: #fdecec; color: #b3261e; border: 1px solid #f3c0bd;
    }
    .auth-form__message.is-success {
      display: block; background: #eaf6ec; color: #1a6b31; border: 1px solid #b8dcbf;
    }
    .auth-form__links {
      margin-top: 20px; text-align: center; font-size: 14px; color: #666;
    }
    .auth-form__links a { color: #c9a24a; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <main class="page">
    <header class="page__head">
      <h1 class="page__title">Вход</h1>
      <p class="page__subtitle">Войдите в свой аккаунт Moscow RP</p>
    </header>

    <form class="auth-form" id="loginForm">
      <h2 class="auth-form__title">Вход в аккаунт</h2>

      <div class="auth-form__field">
        <label class="auth-form__label" for="email">Email</label>
        <input class="auth-form__input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="auth-form__field">
        <label class="auth-form__label" for="password">Пароль</label>
        <input class="auth-form__input" type="password" id="password" placeholder="Ваш пароль" required autocomplete="current-password">
      </div>

      <button class="auth-form__btn" type="submit" id="submitBtn">Войти</button>

      <div class="auth-form__message" id="message"></div>

      <div class="auth-form__links">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </div>
    </form>
  </main>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'auth-form__message ' + (type === 'error' ? 'is-error' : 'is-success');
    }

    function translateError(code) {
      const map = {
        'auth/user-not-found': 'Пользователь с таким email не найден.',
        'auth/wrong-password': 'Неверный пароль.',
        'auth/invalid-credential': 'Неверный email или пароль.',
        'auth/invalid-email': 'Некорректный email.',
        'auth/too-many-requests': 'Слишком много попыток. Попробуйте позже.',
        'auth/network-request-failed': 'Ошибка сети. Попробуйте ещё раз.'
      };
      return map[code] || 'Ошибка: ' + code;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Вход...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMessage('Успешный вход. Перенаправление...', 'success');
        setTimeout(() => { window.location.href = 'profile.html'; }, 800);
      } catch (err) {
        showMessage(translateError(err.code), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    });
  </script>
