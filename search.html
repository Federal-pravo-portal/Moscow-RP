<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://static.tildacdn.com">

  <style>
    .search-box {
      margin: 24px 0 32px;
      position: relative;
    }
    .search-box__input {
      width: 100%;
      padding: 16px 52px 16px 20px;
      font-size: 16px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }
    .search-box__input:focus {
      border-color: #c9a24a;
    }
    .search-box__icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      pointer-events: none;
    }
    .search-results {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .search-item {
      padding: 18px 0;
      border-bottom: 1px solid #e8e8e8;
    }
    .search-item:first-child { padding-top: 0; }
    .search-item:last-child { border-bottom: none; }
    .search-item__link {
      display: block;
      color: inherit;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .search-item__link:hover { opacity: 0.7; }
    .search-item__title {
      font-size: 18px;
      font-weight: 700;
      color: #111;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    .search-item__desc {
      font-size: 14px;
      color: #666;
      margin: 0;
      line-height: 1.5;
    }
    .search-item__title mark {
      background: #fbe9a8;
      color: #111;
      padding: 0 2px;
      border-radius: 2px;
    }
    .search-empty {
      padding: 40px 0;
      color: #888;
      text-align: center;
      font-size: 15px;
    }
    @media (max-width: 640px) {
      .search-box__input { padding: 14px 46px 14px 16px; font-size: 15px; }
      .search-item__title { font-size: 16px; }
    }
  </style>
</head>
<body>

  <main class="page">
    <header class="page__head">
      <h1 class="page__title">Поиск по сайту</h1>
      <p class="page__subtitle">Введите название документа, номер или ключевое слово</p>
    </header>

    <div class="search-box">
      <input type="text" class="search-box__input" id="searchInput" placeholder="Например: указ 1, конституция, постановление правительства..." autocomplete="off">
      <span class="search-box__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
    </div>

    <ul class="search-results" id="searchResults"></ul>
    <div class="search-empty" id="searchEmpty">Начните вводить запрос</div>
  </main>

  <script src="search-index.js"></script>
  <script>
  (function () {
    var input = document.getElementById('searchInput');
    var results = document.getElementById('searchResults');
    var empty = document.getElementById('searchEmpty');

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
      });
    }

    function highlight(text, query) {
      var safe = escapeHtml(text);
      if (!query) return safe;
      var q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return safe.replace(new RegExp('(' + q + ')', 'gi'), '<mark>$1</mark>');
    }

    function search(query) {
      var q = query.trim().toLowerCase();
      if (!q) {
        results.innerHTML = '';
        empty.textContent = 'Начните вводить запрос';
        empty.style.display = 'block';
        return;
      }

      var found = SITE_PAGES.filter(function (page) {
        var haystack = (page.title + ' ' + page.desc + ' ' + (page.keywords || '')).toLowerCase();
        return haystack.indexOf(q) !== -1;
      });

      if (found.length === 0) {
        results.innerHTML = '';
        empty.textContent = 'Ничего не найдено по запросу «' + query + '»';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      results.innerHTML = found.map(function (page) {
        return '<li class="search-item">' +
          '<a class="search-item__link" href="' + page.url + '">' +
            '<h2 class="search-item__title">' + highlight(page.title, query) + '</h2>' +
            '<p class="search-item__desc">' + highlight(page.desc, query) + '</p>' +
          '</a>' +
        '</li>';
      }).join('');
    }

    input.addEventListener('input', function () { search(input.value); });

    // Если в URL пришёл ?q=... — подставляем
    var params = new URLSearchParams(window.location.search);
    var initial = params.get('q');
    if (initial) {
      input.value = initial;
      search(initial);
    }
  })();
  </script>

</body>
