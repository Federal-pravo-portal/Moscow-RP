<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Государственное руководство — Moscow RP</title>
  <meta name="description" content="Государственное руководство проекта Moscow RP.">
  <link rel="icon" type="image/png" href="ikon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://static.tildacdn.com">
  <link rel="stylesheet" href="https://static.tildacdn.com/css/tilda-fonts-1.0.min.css">
  <style>
    .officials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .official-card {
      position: relative;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 28px 20px 24px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .official-card:hover {
      border-color: #c9a24a;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transform: translateY(-2px);
    }
    .official-card__photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 18px;
      background: #f0f0f0;
      border: 3px solid #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .official-card__photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .official-card__name {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .official-card__position {
      font-size: 14px;
      color: #c9a24a;
      font-weight: 600;
      margin: 0 0 6px;
      line-height: 1.4;
    }
    .official-card__rank {
      font-size: 13px;
      color: #666;
      margin: 0 0 12px;
      line-height: 1.4;
      font-style: italic;
    }
    .official-card__date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #999;
      padding-top: 12px;
      border-top: 1px solid #eee;
      width: 100%;
      justify-content: center;
    }
    .official-card__date svg { color: #c9a24a; flex-shrink: 0; }

    .official-card__delete {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #e0b5b3;
      color: #c9302c;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
    }
    .official-card__delete.is-visible { display: inline-flex; }
    .official-card__delete:hover { background: #c9302c; color: #fff; }

    @media (max-width: 640px) {
      .officials-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .official-card { padding: 22px 16px 20px; }
      .official-card__photo { width: 100px; height: 100px; margin-bottom: 14px; }
      .official-card__name { font-size: 15px; }
      .official-card__position { font-size: 13px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="site-header__menu">
      <a href="fz.html" class="site-header__link">Федеральное законодательство</a>
      <a href="gos.html" class="site-header__link is-current">Государственное руководство</a>
      <a href="akty.html" class="site-header__link">Акты</a>
    </nav>
    <a href="index.html" class="site-header__title">Moscow RP</a>
    <a href="https://discord.gg/Rw82hSQfhw" target="_blank" rel="noopener" class="site-header__discord" title="Discord" aria-label="Discord">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/>
      </svg>
    </a>
  </header>

  <main class="page">
    <header class="page__head">
      <h1 class="page__title">Государственное руководство</h1>
      <p class="page__subtitle">Структура государственной власти проекта Moscow RP</p>
    </header>

    <div id="newOfficialBlock" style="display:none;margin-bottom:28px;">
      <a href="add-official.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:#c9302c;color:#fff;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Добавить члена руководства
      </a>
    </div>

    <div class="officials-grid" id="officialsGrid"></div>
  </main>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, orderBy, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const gridEl = document.getElementById('officialsGrid');
    let currentRole = 'citizen';

    loadOfficials();

    async function loadOfficials() {
      try {
        const q = query(collection(db, 'officials'), orderBy('appointedAt', 'desc'));
        const snap = await getDocs(q);
        if (snap.empty) {
          gridEl.innerHTML = '<p style="color:#888;grid-column:1/-1;text-align:center;padding:40px 0;">Пока нет добавленных членов руководства.</p>';
          return;
        }
        const items = [];
        snap.forEach((d) => items.push({ id: d.id, data: d.data() }));
        gridEl.innerHTML = items.map(renderCard).join('');
        updateDeleteBtns();
      } catch (err) {
        console.error('Ошибка загрузки:', err);
        gridEl.innerHTML = '<p style="color:#b3261e;grid-column:1/-1;text-align:center;">Ошибка загрузки. Откройте консоль (F12).</p>';
      }
    }

    function renderCard(item) {
      const d = item.data;
      const date = formatDateStr(d.appointedAt);
      return `
        <div class="official-card" data-doc-id="${item.id}">
          <button class="official-card__delete" type="button" data-id="${item.id}" data-name="${esc(d.fullname)}" title="Удалить">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <div class="official-card__photo">
            <img src="${esc(d.photoUrl || '')}" alt="${esc(d.fullname)}" loading="lazy">
          </div>
          <h3 class="official-card__name">${esc(d.fullname || '')}</h3>
          <p class="official-card__position">${esc(d.position || '')}</p>
          <p class="official-card__rank">${esc(d.rank || '')}</p>
          <p class="official-card__date">
            <svg width="12" height="14" viewBox="0 0 14 16" fill="currentColor"><path d="M3 0h6l3 3v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5 1v3h3L8 1z"/></svg>
            <span>Назначен ${date}</span>
          </p>
        </div>`;
    }

    onAuthStateChanged(auth, async (user) => {
      const block = document.getElementById('newOfficialBlock');
      if (user) {
        try {
          const t = await user.getIdTokenResult();
          currentRole = t.claims.role || 'citizen';
        } catch (e) {}
      }
      if (block) block.style.display = (currentRole === 'government') ? 'block' : 'none';
      updateDeleteBtns();
    });

    function updateDeleteBtns() {
      const show = currentRole === 'government';
      document.querySelectorAll('.official-card__delete').forEach((btn) => {
        btn.classList.toggle('is-visible', show);
        btn.onclick = (e) => {
          e.preventDefault();
          const id = btn.getAttribute('data-id');
          const name = btn.getAttribute('data-name');
          if (id) handleDelete(id, name);
        };
      });
    }

    async function handleDelete(docId, name) {
      if (!confirm('Удалить запись?\n\n«' + name + '»\n\nДействие необратимо.')) return;
      try {
        await deleteDoc(doc(db, 'officials', docId));
        document.querySelector('.official-card[data-doc-id="' + docId + '"]')?.remove();
      } catch (err) { alert('Ошибка: ' + err.message); }
    }

    function formatDateStr(s) {
      if (!s) return '';
      const parts = s.split('-');
      if (parts.length !== 3) return s;
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return parseInt(parts[2], 10) + ' ' + m[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
</body>
</html>
