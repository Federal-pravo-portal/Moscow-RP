<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Государственное руководство — Moscow RP</title>
  <meta name="description" content="Государственное руководство проекта Moscow RP.">
  <link rel="icon" type="image/png" href="ikon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://static.tildacdn.com">
  <link rel="stylesheet" href="https://static.tildacdn.com/css/tilda-fonts-1.0.min.css">
  <style>
    .officials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .official-card {
      position: relative;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 28px 20px 24px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .official-card:hover { border-color: #c9a24a; box-shadow: 0 8px 24px rgba(0,0,0,0.06); transform: translateY(-2px); }
    .official-card__photo {
      width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
      margin: 0 auto 18px; background: #f0f0f0;
      border: 3px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .official-card__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .official-card__name { font-size: 17px; font-weight: 700; color: #111; margin: 0 0 8px; line-height: 1.3; }
    .official-card__position { font-size: 14px; color: #c9a24a; font-weight: 600; margin: 0 0 6px; line-height: 1.4; }
    .official-card__rank { font-size: 13px; color: #666; margin: 0 0 12px; line-height: 1.4; font-style: italic; }
    .official-card__date {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: #999;
      padding-top: 12px; border-top: 1px solid #eee;
      width: 100%; justify-content: center;
    }
    .official-card__date svg { color: #c9a24a; flex-shrink: 0; }

    .official-card__actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
    .official-card__btn {
      width: 28px; height: 28px; border-radius: 50%;
      background: #fff; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      padding: 0; z-index: 2;
    }
    .official-card__btn.is-visible { display: inline-flex; }
    .official-card__btn--edit { border: 1px solid #d4c187; color: #c9a24a; }
    .official-card__btn--edit:hover { background: #c9a24a; color: #fff; }
    .official-card__btn--delete { border: 1px solid #e0b5b3; color: #c9302c; }
    .official-card__btn--delete:hover { background: #c9302c; color: #fff; }

    .off-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
      overflow-y: auto;
    }
    .off-modal.is-open { display: flex; }
    .off-modal__box {
      background: #fff; border-radius: 16px;
      max-width: 560px; width: 100%;
      padding: 32px 28px;
      max-height: 90vh; overflow-y: auto;
      position: relative;
    }
    .off-modal__close {
      position: absolute; top: 14px; right: 14px;
      width: 32px; height: 32px; border-radius: 50%;
      background: #f4f4f4; border: none; color: #666;
      cursor: pointer; font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .off-modal__close:hover { background: #e8e8e8; }
    .off-modal__title { font-size: 20px; font-weight: 700; margin: 0 0 20px; }

    .off-form__field { margin-bottom: 16px; }
    .off-form__label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
    .off-form__input { width: 100%; padding: 11px 14px; font-size: 15px; font-family: inherit; border: 1.5px solid #d8d8d8; border-radius: 8px; outline: none; box-sizing: border-box; background: #fff; color: #111; }
    .off-form__input:focus { border-color: #c9a24a; }

    .off-form__photo { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
    .off-form__photo-preview {
      width: 80px; height: 80px; border-radius: 50%;
      background: #eee; flex-shrink: 0;
      border: 2px solid #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .off-form__photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .off-form__file { display: inline-block; padding: 9px 14px; background: #fff; border: 1.5px dashed #c9a24a; border-radius: 8px; font-size: 13px; color: #666; cursor: pointer; }
    .off-form__file input { display: none; }
    .off-form__file:hover { background: #fff8e6; }

    .off-form__actions { display: flex; gap: 10px; margin-top: 20px; }
    .off-form__btn { flex: 1; padding: 13px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; }
    .off-form__btn--save { background: #c9a24a; color: #fff; }
    .off-form__btn--save:hover { background: #b8903a; }
    .off-form__btn--save:disabled { opacity: .6; cursor: not-allowed; }
    .off-form__btn--cancel { background: #f4f4f4; color: #555; }
    .off-form__btn--cancel:hover { background: #e8e8e8; }

    .off-form__message { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; }
    .off-form__message.is-error { display: block; background: #fdecec; color: #b3261e; border: 1px solid #f3c0bd; }
    .off-form__message.is-success { display: block; background: #eaf6ec; color: #1a6b31; border: 1px solid #b8dcbf; }
  </style>
</head>

  <main class="page">
    <header class="page__head">
      <h1 class="page__title">Государственное руководство</h1>
      <p class="page__subtitle">Структура государственной власти проекта Moscow RP</p>

    <div id="newOfficialBlock" style="display:none;margin-bottom:28px;">
      <a href="add-official.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:#c9302c;color:#fff;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>

  <div class="off-modal" id="editModal">
    <div class="off-modal__box">
      <button class="off-modal__close" type="button" id="modalClose" aria-label="Закрыть">×</button>
      <h2 class="off-modal__title">Редактировать запись</h2>

      <form id="editForm">
        <div class="off-form__field">
          <label class="off-form__label">Фотография</label>
          <div class="off-form__photo">
            <div class="off-form__photo-preview">
              <img src="" alt="" id="editPhotoImg">
            </div>
            <label class="off-form__file">
              <input type="file" id="editPhoto" accept="image/*">
              Заменить фото
            </label>
          </div>
        </div>

        <div class="off-form__field">
          <label class="off-form__label" for="editFullname">Фамилия Имя Отчество</label>
          <input class="off-form__input" type="text" id="editFullname" required>
        </div>

        <div class="off-form__field">
          <label class="off-form__label" for="editPosition">Должность</label>
          <input class="off-form__input" type="text" id="editPosition" required>
        </div>

        <div class="off-form__field">
          <label class="off-form__label" for="editRank">Звание</label>
          <input class="off-form__input" type="text" id="editRank" required>
        </div>

        <div class="off-form__field">
          <label class="off-form__label" for="editAppointedAt">Дата назначения</label>
          <input class="off-form__input" type="date" id="editAppointedAt" required>
        </div>

        <div class="off-form__actions">
          <button type="button" class="off-form__btn off-form__btn--cancel" id="cancelBtn">Отмена</button>

  <script type="module" src="js/auth-header.js?v=22"></script>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, query, orderBy, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const CLOUDINARY_CLOUD_NAME = "uykb5ubk";
    const CLOUDINARY_UPLOAD_PRESET = "moscow_rp_uploads";

    const gridEl = document.getElementById('officialsGrid');
    const modal = document.getElementById('editModal');
    const modalClose = document.getElementById('modalClose');
    const cancelBtn = document.getElementById('cancelBtn');
    const editForm = document.getElementById('editForm');
    const editPhotoInput = document.getElementById('editPhoto');
    const editPhotoImg = document.getElementById('editPhotoImg');
    const editMessage = document.getElementById('editMessage');
    const saveBtn = document.getElementById('saveBtn');

    let currentRole = 'citizen';
    let currentEditId = null;
    let currentPhotoUrl = '';

    loadOfficials();

    async function loadOfficials() {
      try {
        const q = query(collection(db, 'officials'), orderBy('appointedAt', 'desc'));
        const snap = await getDocs(q);
        if (snap.empty) {
          gridEl.innerHTML = '<p style="color:#888;grid-column:1/-1;text-align:center;padding:40px 0;">Пока нет добавленных членов руководства.</p>';
          return;
        }
        const items = [];
        snap.forEach((d) => items.push({ id: d.id, data: d.data() }));
        gridEl.innerHTML = items.map(renderCard).join('');
        updateCardBtns();
      } catch (err) {
        console.error(err);
        gridEl.innerHTML = '<p style="color:#b3261e;grid-column:1/-1;text-align:center;">Ошибка загрузки. F12 → Console.</p>';
      }
    }

    function renderCard(item) {
      const d = item.data;
      const date = formatDateStr(d.appointedAt);
      return `
        <div class="official-card" data-doc-id="${item.id}">
          <div class="official-card__actions">
            <button class="official-card__btn official-card__btn--edit" type="button" data-id="${item.id}" title="Редактировать">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </button>
            <button class="official-card__btn official-card__btn--delete" type="button" data-id="${item.id}" data-name="${esc(d.fullname)}" title="Удалить">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="official-card__photo">
            <img src="${esc(d.photoUrl || '')}" alt="${esc(d.fullname)}" loading="lazy">
          </div>
          <h3 class="official-card__name">${esc(d.fullname || '')}</h3>
          <p class="official-card__position">${esc(d.position || '')}</p>
          <p class="official-card__rank">${esc(d.rank || '')}</p>
          <p class="official-card__date">
            <svg width="12" height="14" viewBox="0 0 14 16" fill="currentColor"><path d="M3 0h6l3 3v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm5 1v3h3L8 1z"/></svg>
            <span>Назначен ${date}</span>
          </p>
        </div>`;
    }

    onAuthStateChanged(auth, async (user) => {
      const block = document.getElementById('newOfficialBlock');
      if (user) {
        try {
          const t = await user.getIdTokenResult();
          currentRole = t.claims.role || 'citizen';
        } catch (e) {}
      }
      if (block) block.style.display = (currentRole === 'government') ? 'block' : 'none';
      updateCardBtns();
    });

    function updateCardBtns() {
      const show = currentRole === 'government';

      document.querySelectorAll('.official-card__btn--delete').forEach((btn) => {
        btn.classList.toggle('is-visible', show);
        btn.onclick = (e) => {
          e.preventDefault();
          const id = btn.getAttribute('data-id');
          if (id) handleDelete(id, btn.getAttribute('data-name'));
        };
      });

      document.querySelectorAll('.official-card__btn--edit').forEach((btn) => {
        btn.classList.toggle('is-visible', show);
        btn.onclick = (e) => {
          e.preventDefault();
          const id = btn.getAttribute('data-id');
          const card = btn.closest('.official-card');
          if (id && card) openEditModal(id, card);
        };
      });
    }

    function openEditModal(id, card) {
      currentEditId = id;

      const name = card.querySelector('.official-card__name').textContent;
      const position = card.querySelector('.official-card__position').textContent;
      const rank = card.querySelector('.official-card__rank').textContent;
      const dateText = card.querySelector('.official-card__date span').textContent;
      const photoUrl = card.querySelector('.official-card__photo img').getAttribute('src');

      document.getElementById('editFullname').value = name;
      document.getElementById('editPosition').value = position;
      document.getElementById('editRank').value = rank;

      const dateISO = parseRussianDateToISO(dateText.replace('Назначен ', ''));
      document.getElementById('editAppointedAt').value = dateISO;

      editPhotoImg.src = photoUrl;
      currentPhotoUrl = photoUrl;

      editMessage.className = 'off-form__message';
      editMessage.textContent = '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Сохранить';

      modal.classList.add('is-open');
    }

    function closeEditModal() {
      modal.classList.remove('is-open');
      currentEditId = null;
      currentPhotoUrl = '';
      editPhotoInput.value = '';
    }

    modalClose.addEventListener('click', closeEditModal);
    cancelBtn.addEventListener('click', closeEditModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeEditModal(); });

    editPhotoInput.addEventListener('change', () => {
      const file = editPhotoInput.files[0];
      if (!file) return;
      editPhotoImg.src = URL.createObjectURL(file);
    });

    editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentEditId) return;
      if (currentRole !== 'government') {
        showEditMessage('Недостаточно прав.', 'error');
        return;
      }

      const fullname = document.getElementById('editFullname').value.trim();
      const position = document.getElementById('editPosition').value.trim();
      const rank = document.getElementById('editRank').value.trim();
      const appointedAt = document.getElementById('editAppointedAt').value;
      const file = editPhotoInput.files[0];

      if (!fullname || !position || !rank || !appointedAt) {
        showEditMessage('Заполните все поля.', 'error');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохранение...';

      try {
        let photoUrl = currentPhotoUrl;

        if (file) {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

          const response = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/upload', { method: 'POST', body: formData });
          if (!response.ok) {
            const err = await response.json();
            throw new Error((err.error && err.error.message) || 'Ошибка Cloudinary');
          }
          const data = await response.json();
          photoUrl = data.secure_url;
        }

        await updateDoc(doc(db, 'officials', currentEditId), {
          fullname: fullname,
          position: position,
          rank: rank,
          appointedAt: appointedAt,
          photoUrl: photoUrl
        });

        showEditMessage('Сохранено!', 'success');
        setTimeout(() => {
          closeEditModal();
          loadOfficials();
        }, 700);

      } catch (err) {
        console.error(err);
        showEditMessage('Ошибка: ' + err.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Сохранить';
      }
    });

    function showEditMessage(text, type) {
      editMessage.textContent = text;
      editMessage.className = 'off-form__message ' + (type === 'error' ? 'is-error' : 'is-success');
    }

    async function handleDelete(docId, name) {
      if (!confirm('Удалить запись?\n\n«' + name + '»\n\nДействие необратимо.')) return;
      try {
        await deleteDoc(doc(db, 'officials', docId));
        document.querySelector('.official-card[data-doc-id="' + docId + '"]')?.remove();
        if (!gridEl.querySelector('.official-card')) {
          gridEl.innerHTML = '<p style="color:#888;grid-column:1/-1;text-align:center;padding:40px 0;">Пока нет добавленных членов руководства.</p>';
        }
      } catch (err) { alert('Ошибка: ' + err.message); }
    }

    function formatDateStr(s) {
      if (!s) return '';
      const p = s.split('-');
      if (p.length !== 3) return s;
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return parseInt(p[2], 10) + ' ' + m[parseInt(p[1], 10) - 1] + ' ' + p[0];
    }

    function parseRussianDateToISO(str) {
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      const parts = str.trim().split(/\s+/);
      if (parts.length !== 3) return '';
      const day = parseInt(parts[0], 10);
      const month = m.indexOf(parts[1].toLowerCase()) + 1;
      const year = parseInt(parts[2], 10);
      if (!day || !month || !year) return '';
      return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
