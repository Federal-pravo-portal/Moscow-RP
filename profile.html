  <style>
    .profile-card {
      max-width: 560px;
      margin: 40px auto 0;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.05);
      text-align: center;
    }
    .profile-card__avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: #f4f4f4;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      color: #bbb;
      border: 3px solid #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .profile-card__name {
      font-size: 24px; font-weight: 700; color: #111;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .profile-card__email {
      font-size: 14px; color: #666; margin: 0 0 18px;
    }
    .profile-card__role {
      display: inline-block;
      font-size: 12px; font-weight: 700;
      padding: 5px 12px;
      border-radius: 6px;
      background: #c9a24a; color: #fff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .profile-card__role--citizen { background: #777; }
    .profile-card__role--government { background: #c9a24a; }
    .profile-card__role--editor { background: #c9a24a; }

    .profile-card__actions {
      margin-top: 32px;
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    }
    .profile-card__btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px;
      font-size: 14px; font-weight: 600;
      border-radius: 8px; cursor: pointer; font-family: inherit;
      text-decoration: none; border: none;
    }
    .profile-card__btn--main {
      background: #c9302c; color: #fff;
    }
    .profile-card__btn--main:hover { background: #a82822; }
    .profile-card__btn--ghost {
      background: #f4f4f4; color: #333;
    }
    .profile-card__btn--ghost:hover { background: #e8e8e8; }

    .profile-card__loader {
      color: #888; font-size: 15px; padding: 30px 0;
    }
  </style>
</head>

  <main class="page">
    <header class="page__head">
      <h1 class="page__title">Профиль</h1>
      <p class="page__subtitle">Информация о вашем аккаунте</p>
    </header>

    <div class="profile-card" id="profileCard">
      <p class="profile-card__loader">Загрузка профиля…</p>
    </div>
  </main>

  <script type="module" src="js/auth-header.js?v=22"></script>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const card = document.getElementById('profileCard');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      let role = 'citizen';
      try {
        const token = await user.getIdTokenResult();
        role = token.claims.role || 'citizen';
      } catch (e) {}

      const roleLabel = {
        'government': 'Правительство',
        'editor':     'Администратор',
        'citizen':    'Гражданин РФ'
      }[role] || 'Гражданин РФ';

      const roleClass = {
        'government': 'profile-card__role--government',
        'editor':     'profile-card__role--editor',
        'citizen':    'profile-card__role--citizen'
      }[role] || 'profile-card__role--citizen';

      const displayName = user.displayName || (user.email || '').split('@')[0] || 'Гражданин РФ';

      card.innerHTML = `
        <div class="profile-card__avatar">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h2 class="profile-card__name">${escapeHtml(displayName)}</h2>
        <p class="profile-card__email">${escapeHtml(user.email || '')}</p>
        <span class="profile-card__role ${roleClass}">${roleLabel}</span>

        <div class="profile-card__actions">
          <a href="index.html" class="profile-card__btn profile-card__btn--ghost">
            На главную
          </a>
          <button class="profile-card__btn profile-card__btn--main" id="logoutBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Выйти
          </button>
        </div>
      `;

      // Обработка кнопки «Выйти»
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
          await signOut(auth);
          window.location.href = 'index.html';
        } catch (err) {
          console.error(err);
        }
      });
    });

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
