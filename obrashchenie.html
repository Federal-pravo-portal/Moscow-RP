<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обращение — Moscow RP</title>
  <link rel="icon" type="image/png" href="ikon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://static.tildacdn.com">
  <link rel="stylesheet" href="https://static.tildacdn.com/css/tilda-fonts-1.0.min.css">
  <style>
    .obr-view { max-width: 900px; margin: 0 auto; }

    .obr-view__back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; color: #666; text-decoration: none;
      margin-bottom: 24px;
    }
    .obr-view__back:hover { color: #111; }

    .obr-view__card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 36px 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 24px;
    }

    .obr-view__head { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .obr-view__title {
      font-size: 24px; font-weight: 800; color: #111;
      margin: 0 0 10px; line-height: 1.3;
      text-transform: uppercase; letter-spacing: 0.01em;
    }
    .obr-view__date { font-size: 14px; color: #666; }

    /* Статусы */
    .obr-status {
      display: inline-block;
      font-size: 11px; font-weight: 700;
      padding: 5px 12px; border-radius: 6px;
      text-transform: uppercase; letter-spacing: .05em;
      margin-left: 10px;
      vertical-align: middle;
    }
    .obr-status--pending  { background: #fff8e6; color: #a68a2d; border: 1px solid #f0dcaa; }
    .obr-status--progress { background: #e0f4f4; color: #1a7a7a; border: 1px solid #a8dadc; }
    .obr-status--closed   { background: #eaf6ec; color: #1a6b31; border: 1px solid #b8dcbf; }
    .obr-status--rejected { background: #fdecec; color: #b3261e; border: 1px solid #f3c0bd; }

    .obr-view__section { margin-bottom: 24px; }
    .obr-view__label {
      font-size: 11px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .obr-view__value {
      font-size: 15px; color: #111;
      line-height: 1.55;
    }
    .obr-view__value--tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #f4f6f9;
      border: 1px solid #e0e6ed;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    .obr-view__body {
      font-size: 16px; color: #222;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #fafafa;
      border-left: 3px solid #c9a24a;
      padding: 20px 24px;
      border-radius: 6px;
    }

    .obr-view__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 640px) { .obr-view__grid { grid-template-columns: 1fr; gap: 20px; } }

    .obr-view__footer {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid #eee;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .obr-view__btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px; font-size: 14px; font-weight: 600;
      border-radius: 8px; cursor: pointer; text-decoration: none;
      border: none; font-family: inherit; transition: background .2s ease;
    }
    .obr-view__btn--ghost { background: #f4f4f4; color: #333; }
    .obr-view__btn--ghost:hover { background: #e8e8e8; }
    .obr-view__btn--primary { background: #1a6b31; color: #fff; }
    .obr-view__btn--primary:hover { background: #145226; }
    .obr-view__btn--danger { background: #fdecec; color: #b3261e; }
    .obr-view__btn--danger:hover { background: #f8d7d7; }

    .obr-view__empty {
      text-align: center; color: #999; padding: 80px 20px;
      font-size: 15px;
    }
    .obr-view__empty-title {
      font-size: 22px; font-weight: 700; color: #111;
      margin-bottom: 12px;
    }

    /* Тред ответов */
    .obr-thread {
      margin-top: 20px;
    }
    .obr-thread__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .obr-thread__title {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .obr-thread__count {
      display: inline-block;
      font-size: 12px;
      color: #888;
      font-weight: 600;
      margin-left: 6px;
    }

    .obr-reply {
      padding: 22px 26px;
      background: #f4f6f9;
      border-left: 3px solid #4a6b8a;
      border-radius: 8px;
      margin-bottom: 18px;
    }
    .obr-reply--author {
      background: #faf7ef;
      border-left-color: #c9a24a;
    }
    .obr-reply--official {
      background: #eaf6ec;
      border-left-color: #1a6b31;
    }
    .obr-reply--admin {
      background: #fdecec;
      border-left-color: #b3261e;
    }

    .obr-reply__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .obr-reply__who {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }
    .obr-reply__badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .obr-reply__badge--author { background: #c9a24a; color: #fff; }
    .obr-reply__badge--official { background: #1a6b31; color: #fff; }
    .obr-reply__badge--admin { background: #b3261e; color: #fff; }

    .obr-reply__date {
      font-size: 12px;
      color: #888;
    }
    .obr-reply__body {
      font-size: 15px;
      color: #111;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .obr-reply__image {
      display: block;
      width: 100%;
      max-width: 100%;
      max-height: 800px;
      object-fit: contain;
      margin-top: 14px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #fff;
    }
    .obr-reply__actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    .obr-reply__actions button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      color: #666;
      text-decoration: underline;
    }
    .obr-reply__actions button:hover { color: #111; }
    .obr-reply__actions button.is-danger:hover { color: #b3261e; }

    /* Модалки */
    .obr-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .obr-modal.is-open { display: flex; }
    .obr-modal__box {
      background: #fff;
      border-radius: 14px;
      max-width: 560px;
      width: 100%;
      padding: 28px 26px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow-y: auto;
    }
    .obr-modal__close {
      position: absolute; top: 12px; right: 12px;
      width: 32px; height: 32px; border-radius: 50%;
      background: #f4f4f4; border: none; color: #666;
      cursor: pointer; font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .obr-modal__close:hover { background: #e8e8e8; }
    .obr-modal__title { font-size: 18px; font-weight: 700; margin: 0 0 20px; color: #111; }

    .obr-modal__field { margin-bottom: 18px; }
    .obr-modal__label {
      display: block; font-size: 13px; font-weight: 600;
      color: #555; margin-bottom: 8px;
    }
    .obr-modal__textarea {
      width: 100%; padding: 12px 14px;
      font-size: 15px; font-family: inherit;
      border: 1.5px solid #d8d8d8; border-radius: 8px;
      outline: none; box-sizing: border-box;
      min-height: 140px; resize: vertical;
      line-height: 1.55;
    }
    .obr-modal__textarea:focus { border-color: #1a6b31; }

    .obr-modal__file {
      display: block;
      width: 100%;
      padding: 12px 14px;
      background: #fff;
      border: 1.5px dashed #c9a24a;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      box-sizing: border-box;
    }
    .obr-modal__file::-webkit-file-upload-button {
      background: #c9a24a;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-right: 12px;
    }
    .obr-modal__file-preview {
      margin-top: 12px;
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
      border: 1px solid #e8e8e8;
      display: none;
    }
    .obr-modal__file-preview.is-visible { display: block; }
    .obr-modal__file-remove {
      margin-top: 8px;
      font-size: 13px;
      color: #b3261e;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      font-family: inherit;
      display: none;
    }
    .obr-modal__file-remove.is-visible { display: inline-block; }

    .obr-modal__actions { display: flex; gap: 10px; margin-top: 20px; }
    .obr-modal__btn {
      flex: 1; padding: 12px;
      font-size: 14px; font-weight: 600;
      border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit;
    }
    .obr-modal__btn--save { background: #1a6b31; color: #fff; }
    .obr-modal__btn--save:hover { background: #145226; }
    .obr-modal__btn--save:disabled { opacity: .6; cursor: not-allowed; }
    .obr-modal__btn--cancel { background: #f4f4f4; color: #555; }
    .obr-modal__btn--cancel:hover { background: #e8e8e8; }

    .obr-modal__msg {
      margin-top: 12px; padding: 10px 12px;
      border-radius: 8px; font-size: 13px; display: none;
    }
    .obr-modal__msg.is-error { display: block; background: #fdecec; color: #b3261e; }
    .obr-modal__msg.is-success { display: block; background: #eaf6ec; color: #1a6b31; }

    .obr-modal__progress {
      margin-top: 10px; height: 6px; background: #eee;
      border-radius: 4px; overflow: hidden; display: none;
    }
    .obr-modal__progress.is-visible { display: block; }
    .obr-modal__progress-bar {
      height: 100%; background: #1a6b31; width: 0; transition: width .3s ease;
    }

    /* Статус-модалка */
    .obr-status-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .obr-status-option {
      padding: 14px 16px;
      border-radius: 10px;
      border: 2px solid #e8e8e8;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      transition: all .15s ease;
    }
    .obr-status-option:hover { border-color: #c9a24a; }
    .obr-status-option.is-active { border-color: #c9302c; background: #fff8f8; }
    .obr-status-option__label { display: block; margin-bottom: 4px; }
    .obr-status-option__desc { font-size: 12px; color: #888; font-weight: 500; }

    @media (max-width: 640px) {
      .obr-view__card { padding: 24px 20px; }
      .obr-view__title { font-size: 19px; }
      .obr-status-options { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <!-- Модалка ответа -->
  <div class="obr-modal" id="replyModal">
    <div class="obr-modal__box">
      <button class="obr-modal__close" type="button" id="replyClose">×</button>
      <h3 class="obr-modal__title" id="replyModalTitle">Ответ</h3>

      <div class="obr-modal__field">
        <label class="obr-modal__label" for="replyText">Текст</label>
        <textarea class="obr-modal__textarea" id="replyText"
                  placeholder="Введите текст…"></textarea>
      </div>

      <div class="obr-modal__field">
        <label class="obr-modal__label" for="replyImage">Изображение (необязательно)</label>
        <input class="obr-modal__file" type="file" id="replyImage" accept="image/*">
        <img class="obr-modal__file-preview" id="replyPreview" alt="Предпросмотр">
        <button type="button" class="obr-modal__file-remove" id="replyRemoveImage">Убрать изображение</button>
      </div>

      <div class="obr-modal__actions">
        <button type="button" class="obr-modal__btn obr-modal__btn--cancel" id="replyCancel">Отмена</button>
        <button type="button" class="obr-modal__btn obr-modal__btn--save" id="replySave">Отправить</button>
      </div>

      <div class="obr-modal__progress" id="replyProgress">
        <div class="obr-modal__progress-bar" id="replyProgressBar"></div>
      </div>
      <div class="obr-modal__msg" id="replyMsg"></div>
    </div>
  </div>

  <!-- Модалка смены статуса -->

    <div class="obr-modal__box">
      <button class="obr-modal__close" type="button" id="statusClose">×</button>
      <h3 class="obr-modal__title">Изменить статус</h3>

      <div class="obr-status-options">
        <button type="button" class="obr-status-option" data-status="pending">
          <span class="obr-status-option__label">На рассмотрении</span>
          <span class="obr-status-option__desc">Обращение получено и ожидает обработки</span>
        </button>
        <button type="button" class="obr-status-option" data-status="progress">
          <span class="obr-status-option__label">В производстве</span>
          <span class="obr-status-option__desc">Обращение взято в работу сотрудниками</span>
        </button>
        <button type="button" class="obr-status-option" data-status="closed">
          <span class="obr-status-option__label">Закрыто</span>
          <span class="obr-status-option__desc">Обращение рассмотрено и решено</span>
        </button>
        <button type="button" class="obr-status-option" data-status="rejected">
          <span class="obr-status-option__label">Отклонено</span>
          <span class="obr-status-option__desc">Обращение отклонено без рассмотрения</span>
        </button>
      </div>

      <div class="obr-modal__actions">
        <button type="button" class="obr-modal__btn obr-modal__btn--cancel" id="statusCancel">Отмена</button>
        <button type="button" class="obr-modal__btn obr-modal__btn--save" id="statusSave" disabled>Сохранить</button>
      </div>

      <div class="obr-modal__msg" id="statusMsg"></div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getClaims, canEdit } from "./js/permissions.js";

    const CLOUDINARY_CLOUD_NAME = "uykb5ubk";
    const CLOUDINARY_UPLOAD_PRESET = "moscow_rp_uploads";

    const params = new URLSearchParams(window.location.search);
    const obrId = params.get('id');

    const obrView = document.getElementById('obrView');

    // Ответы
    const replyModal = document.getElementById('replyModal');
    const replyClose = document.getElementById('replyClose');
    const replyCancel = document.getElementById('replyCancel');
    const replySave = document.getElementById('replySave');
    const replyModalTitle = document.getElementById('replyModalTitle');
    const replyText = document.getElementById('replyText');
    const replyImage = document.getElementById('replyImage');
    const replyPreview = document.getElementById('replyPreview');
    const replyRemoveImage = document.getElementById('replyRemoveImage');
    const replyMsg = document.getElementById('replyMsg');
    const replyProgress = document.getElementById('replyProgress');
    const replyProgressBar = document.getElementById('replyProgressBar');

    // Статусы
    const statusModal = document.getElementById('statusModal');
    const statusClose = document.getElementById('statusClose');
    const statusCancel = document.getElementById('statusCancel');
    const statusSave = document.getElementById('statusSave');
    const statusMsg = document.getElementById('statusMsg');

    let currentUser = null;
    let currentClaims = { role: 'citizen', sections: [] };
    let obrData = null;

    let pendingReplyFile = null;
    let editingReplyIndex = -1;   // -1 — новый ответ, иначе индекс в массиве replies
    let pendingStatus = null;

    const STATUS_LABELS = {
      'pending':  'На рассмотрении',
      'progress': 'В производстве',
      'closed':   'Закрыто',
      'rejected': 'Отклонено'
    };

    if (!obrId) {
      obrView.innerHTML = '<div class="obr-view__empty"><div class="obr-view__empty-title">Обращение не найдено</div>Вернитесь к <a href="akty.html">списку организаций</a>.</div>';
    } else {
      loadObrashchenie();
    }

    async function loadObrashchenie() {
      try {
        const snap = await getDoc(doc(db, 'obrashcheniya', obrId));
        if (!snap.exists()) {
          obrView.innerHTML = '<div class="obr-view__empty"><div class="obr-view__empty-title">Обращение не найдено</div>Возможно, оно было удалено.</div>';
          return;
        }
        obrData = { id: obrId, ...snap.data() };

        // Совместимость со старым форматом (reply / replyImageUrl)
        if (!Array.isArray(obrData.replies)) {
          obrData.replies = [];
          if (obrData.reply || obrData.replyImageUrl) {
            obrData.replies.push({
              text: obrData.reply || '',
              imageUrl: obrData.replyImageUrl || '',
              authorName: obrData.orgShortName || 'Организация',
              authorUid: '',
              authorRole: 'official',
              createdAt: obrData.repliedAt || obrData.createdAt
            });
          }
        }

        render();
      } catch (e) {
        console.error(e);
        obrView.innerHTML = '<div class="obr-view__empty" style="color:#b3261e;">Ошибка загрузки обращения.</div>';
      }
    }

    function canManageObr() {
      const d = obrData;
      if (!d) return false;
      return currentClaims.role === 'admin'
        || currentClaims.role === 'government'
        || (d.orgSection ? canEdit(d.orgSection, currentClaims) : false);
    }

    function isAuthor() {
      return obrData && currentUser && obrData.authorUid === currentUser.uid;
    }

    function render() {
      const d = obrData;

      // Статус
      const statusKey = d.status || 'pending';
      const statusLabel = STATUS_LABELS[statusKey] || 'На рассмотрении';
      const statusClass = 'obr-status obr-status--' + statusKey;

      const canManage = canManageObr();
      const author = isAuthor();

      const backHref = 'obrashcheniya-org.html?id=' + esc(d.orgId || '') + (d.orgTabId ? '&tab=' + esc(d.orgTabId) : '');

      const tabBlock = d.orgTabLabel
        ? `<div class="obr-view__value obr-view__value--tab">
             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
             ${esc(d.orgTabLabel)}
           </div>`
        : '';

      // Рендер треда ответов
      const replies = d.replies || [];
      const repliesHtml = replies.length
        ? replies.map((r, i) => renderReply(r, i, canManage, author)).join('')
        : `<div style="text-align:center;color:#999;padding:30px 20px;background:#fafafa;border:1px dashed #e0e0e0;border-radius:10px;font-size:14px;">Пока нет ответов. Будьте первым, кто напишет.</div>`;

      // Кнопка ответа: показываем, если (сотрудник) ИЛИ (автор) И (статус != closed/rejected)
      const canReply = (canManage || author) && statusKey !== 'closed' && statusKey !== 'rejected';

      obrView.innerHTML = `
        <a href="${backHref}" class="obr-view__back">← Вернуться к организации</a>

        <div class="obr-view__card">
          <div class="obr-view__head">
            <h1 class="obr-view__title">
              ${esc(d.title || 'Обращение')}
              <span class="${statusClass}">${statusLabel}</span>
            </h1>
            <div class="obr-view__date">Подано: ${formatDate(d.createdAt)}</div>
          </div>

          <div class="obr-view__grid">
            <div class="obr-view__section">
              <div class="obr-view__label">Кто подаёт</div>
              <div class="obr-view__value">${esc(d.authorName || '—')}</div>
            </div>
            <div class="obr-view__section">
              <div class="obr-view__label">Организация</div>
              <div class="obr-view__value">${esc(d.orgShortName || '—')}</div>
            </div>
            <div class="obr-view__section">
              <div class="obr-view__label">Серия и номер паспорта</div>
              <div class="obr-view__value">${esc(d.passport || '—')}</div>
            </div>
            <div class="obr-view__section">
              <div class="obr-view__label">Дата рождения</div>
              <div class="obr-view__value">${formatBirthDate(d.birthDate)}</div>
            </div>
          </div>

          ${d.orgTabLabel ? `
            <div class="obr-view__section">
              <div class="obr-view__label">Вкладка обращения</div>
              ${tabBlock}
            </div>
          ` : ''}

          <div class="obr-view__section">
            <div class="obr-view__label">Суть обращения</div>
            <div class="obr-view__body">${esc(d.body || '')}</div>
          </div>

          <div class="obr-view__footer">
            <a href="akty.html" class="obr-view__btn obr-view__btn--ghost">← К списку организаций</a>
            ${canManage ? `
              <button type="button" class="obr-view__btn obr-view__btn--ghost" id="statusBtn">
                Изменить статус
              </button>
              <button type="button" class="obr-view__btn obr-view__btn--danger" id="deleteBtn">
                Удалить обращение
              </button>
            ` : ''}
          </div>
        </div>

        <div class="obr-thread">
          <div class="obr-thread__header">
            <h2 class="obr-thread__title">Ответы <span class="obr-thread__count">(${replies.length})</span></h2>
          </div>

          ${repliesHtml}

          ${canReply ? `
            <button type="button" class="obr-view__btn obr-view__btn--primary" id="replyBtn" style="margin-top: 16px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              Написать ответ
            </button>
          ` : `
            ${(statusKey === 'closed' || statusKey === 'rejected') ? `
              <div style="text-align:center;color:#888;padding:16px;background:#f4f4f4;border-radius:8px;font-size:13px;margin-top:16px;">
                Обращение ${statusKey === 'closed' ? 'закрыто' : 'отклонено'} — ответы недоступны.
              </div>
            ` : ''}
          `}
        </div>
      `;

      // Привязки
      const statusBtn = document.getElementById('statusBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      const replyBtn = document.getElementById('replyBtn');

      if (statusBtn) statusBtn.onclick = () => openStatusModal();
      if (replyBtn) replyBtn.onclick = () => openReplyModal(-1);

      if (deleteBtn) {
        deleteBtn.onclick = async () => {
          if (!confirm('Удалить это обращение? Действие необратимо.')) return;
          try {
            await deleteDoc(doc(db, 'obrashcheniya', obrId));
            window.location.href = backHref;
          } catch (e) { alert('Ошибка: ' + e.message); }
        };
      }

      // Кнопки «Редактировать» / «Удалить» на каждом ответе
      obrView.querySelectorAll('.obr-reply__actions button').forEach(btn => {
        btn.onclick = async () => {
          const idx = parseInt(btn.getAttribute('data-idx'), 10);
          const action = btn.getAttribute('data-action');
          if (action === 'edit') openReplyModal(idx);
          if (action === 'delete') await deleteReply(idx);
        };
      });
    }

    function renderReply(r, idx, canManage, author) {
      // Определяем тип и цвет
      let typeClass = 'obr-reply--official';
      let badgeClass = 'obr-reply__badge--official';
      let badgeText = 'Организация';

      if (r.authorUid && r.authorUid === obrData.authorUid) {
        typeClass = 'obr-reply--author';
        badgeClass = 'obr-reply__badge--author';
        badgeText = 'Автор';
      } else if (currentClaims.role === 'admin' && r.authorUid === currentUser?.uid) {
        typeClass = 'obr-reply--admin';
        badgeClass = 'obr-reply__badge--admin';
        badgeText = 'Администратор';
      }

      // Кто может править/удалять конкретно этот ответ:
      // - автор ответа
      // - admin/government (везде)
      // - сотрудник организации (в ответах организации)
      const canEditThis = (r.authorUid && r.authorUid === currentUser?.uid)
        || currentClaims.role === 'admin'
        || currentClaims.role === 'government'
        || (canManage && r.authorUid !== obrData.authorUid);

      const imageHtml = r.imageUrl
        ? `<img class="obr-reply__image" src="${esc(r.imageUrl)}" alt="Изображение" loading="lazy">`
        : '';

      return `
        <div class="obr-reply ${typeClass}">
          <div class="obr-reply__head">
            <div class="obr-reply__who">
              <span class="obr-reply__badge ${badgeClass}">${badgeText}</span>
              <span>${esc(r.authorName || 'Неизвестный')}</span>
            </div>
            <div class="obr-reply__date">${formatDate(r.createdAt)}</div>
          </div>
          ${r.text ? `<div class="obr-reply__body">${esc(r.text)}</div>` : ''}
          ${imageHtml}
          ${canEditThis ? `
            <div class="obr-reply__actions">
              <button type="button" data-idx="${idx}" data-action="edit">Редактировать</button>
              <button type="button" class="is-danger" data-idx="${idx}" data-action="delete">Удалить</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ============================================================
    // Модалка ответа
    // ============================================================
    function openReplyModal(idx = -1) {
      editingReplyIndex = idx;
      pendingReplyFile = null;
      replyImage.value = '';
      replyPreview.classList.remove('is-visible');
      replyPreview.src = '';
      replyRemoveImage.classList.remove('is-visible');
      replyMsg.className = 'obr-modal__msg';
      replyMsg.textContent = '';
      replyProgress.classList.remove('is-visible');
      replyProgressBar.style.width = '0%';

      if (idx >= 0) {
        // редактирование
        const r = obrData.replies[idx];
        replyModalTitle.textContent = 'Редактировать ответ';
        replyText.value = r?.text || '';
        if (r?.imageUrl) {
          replyPreview.src = r.imageUrl;
          replyPreview.classList.add('is-visible');
          replyRemoveImage.classList.add('is-visible');
        }
        replySave.textContent = 'Сохранить';
      } else {
        replyModalTitle.textContent = canManageObr() ? 'Ответ от организации' : 'Ваш ответ';
        replyText.value = '';
        replySave.textContent = 'Отправить';
      }

      replyModal.classList.add('is-open');
      replyText.focus();
    }

    function closeReplyModal() {
      replyModal.classList.remove('is-open');
      editingReplyIndex = -1;
      pendingReplyFile = null;
      replyText.value = '';
      replyImage.value = '';
      replyPreview.src = '';
      replyPreview.classList.remove('is-visible');
      replyRemoveImage.classList.remove('is-visible');
      // Сбрасываем флаг удаления картинки
      if (obrData) delete obrData._removeReplyImage;
    }

    replyClose.onclick = closeReplyModal;
    replyCancel.onclick = closeReplyModal;
    replyModal.addEventListener('click', (e) => { if (e.target === replyModal) closeReplyModal(); });

    replyImage.addEventListener('change', () => {
      const file = replyImage.files[0];
      if (!file) return;
      pendingReplyFile = file;
      replyPreview.src = URL.createObjectURL(file);
      replyPreview.classList.add('is-visible');
      replyRemoveImage.classList.add('is-visible');
    });

    replyRemoveImage.onclick = () => {
      pendingReplyFile = null;
      replyImage.value = '';
      replyPreview.src = '';
      replyPreview.classList.remove('is-visible');
      replyRemoveImage.classList.remove('is-visible');
      if (editingReplyIndex >= 0 && obrData?.replies?.[editingReplyIndex]?.imageUrl) {
        obrData._removeReplyImage = true;
      }
    };

    replySave.onclick = async () => {
      const text = replyText.value.trim();
      const hasFile = !!pendingReplyFile;

      const isEditing = editingReplyIndex >= 0;
      const existing = isEditing ? obrData.replies[editingReplyIndex] : null;
      const hadImage = !!(existing?.imageUrl);
      const removeImage = !!obrData?._removeReplyImage;

      if (!text && !hasFile && !(hadImage && !removeImage)) {
        replyMsg.textContent = 'Введите текст или приложите изображение.';
        replyMsg.className = 'obr-modal__msg is-error';
        return;
      }

      replySave.disabled = true;
      replySave.textContent = 'Отправка...';
      replyProgress.classList.add('is-visible');

      try {
        let imageUrl = isEditing ? (existing.imageUrl || '') : '';
        if (removeImage) imageUrl = '';

        if (hasFile) {
          replyProgressBar.style.width = '30%';
          const fd = new FormData();
          fd.append('file', pendingReplyFile);
          fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

          const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/upload', {
            method: 'POST',
            body: fd
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error((err.error && err.error.message) || 'Ошибка загрузки в Cloudinary');
          }
          const data = await res.json();
          imageUrl = data.secure_url;
          replyProgressBar.style.width = '80%';
        }

        // Определяем, кто пишет
        const isOfficialReply = canManageObr() && !isAuthor();
        const authorName = isOfficialReply
          ? (obrData.orgShortName || 'Организация')
          : (currentUser.displayName || (currentUser.email || '').split('@')[0] || 'Автор');

        // Копируем массив
        const newReplies = Array.isArray(obrData.replies) ? [...obrData.replies] : [];

        if (isEditing) {
          newReplies[editingReplyIndex] = {
            ...newReplies[editingReplyIndex],
            text,
            imageUrl,
            editedAt: new Date()
          };
        } else {
          newReplies.push({
            id: 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            text,
            imageUrl,
            authorName,
            authorUid: currentUser.uid,
            authorRole: currentClaims.role,
            authorType: isOfficialReply ? 'official' : 'author',
            createdAt: new Date()
          });
        }

        // Обновляем документ
        const updates = { replies: newReplies };

        // Если это первый ответ организации и статус ещё pending — переводим в progress
        const currentStatus = obrData.status || 'pending';
        if (!isEditing && isOfficialReply && currentStatus === 'pending') {
          updates.status = 'progress';
        }

        await updateDoc(doc(db, 'obrashcheniya', obrId), updates);

        obrData.replies = newReplies;
        if (updates.status) obrData.status = updates.status;
        delete obrData._removeReplyImage;

        replyProgressBar.style.width = '100%';
        replyMsg.textContent = 'Сохранено!';
        replyMsg.className = 'obr-modal__msg is-success';

        setTimeout(() => {
          closeReplyModal();
          render();
        }, 500);

      } catch (e) {
        console.error(e);
        replyMsg.textContent = 'Ошибка: ' + e.message;
        replyMsg.className = 'obr-modal__msg is-error';
      } finally {
        replySave.disabled = false;
        replySave.textContent = isEditing ? 'Сохранить' : 'Отправить';
        replyProgress.classList.remove('is-visible');
      }
    };

    async function deleteReply(idx) {
      if (!confirm('Удалить этот ответ? Действие необратимо.')) return;
      const newReplies = [...obrData.replies];
      newReplies.splice(idx, 1);
      await updateDoc(doc(db, 'obrashcheniya', obrId), { replies: newReplies });
      obrData.replies = newReplies;
      render();
    }

    // ============================================================
    // Модалка статуса
    // ============================================================
    function openStatusModal() {
      pendingStatus = obrData.status || 'pending';
      statusMsg.className = 'obr-modal__msg';
      statusMsg.textContent = '';

      // Подсветить активный
      statusModal.querySelectorAll('.obr-status-option').forEach(btn => {
        btn.classList.toggle('is-active', btn.getAttribute('data-status') === pendingStatus);
      });
      statusSave.disabled = false;

      statusModal.classList.add('is-open');
    }

    function closeStatusModal() {
      statusModal.classList.remove('is-open');
      pendingStatus = null;
    }

    statusClose.onclick = closeStatusModal;
    statusCancel.onclick = closeStatusModal;
    statusModal.addEventListener('click', (e) => { if (e.target === statusModal) closeStatusModal(); });

    statusModal.querySelectorAll('.obr-status-option').forEach(btn => {
      btn.onclick = () => {
        pendingStatus = btn.getAttribute('data-status');
        statusModal.querySelectorAll('.obr-status-option').forEach(b => {
          b.classList.toggle('is-active', b === btn);
        });
      };
    });

    statusSave.onclick = async () => {
      if (!pendingStatus) return;
      statusSave.disabled = true;
      statusSave.textContent = 'Сохранение...';
      try {
        await updateDoc(doc(db, 'obrashcheniya', obrId), { status: pendingStatus });
        obrData.status = pendingStatus;
        statusMsg.textContent = 'Статус обновлён';
        statusMsg.className = 'obr-modal__msg is-success';
        setTimeout(() => {
          closeStatusModal();
          render();
        }, 500);
      } catch (e) {
        statusMsg.textContent = 'Ошибка: ' + e.message;
        statusMsg.className = 'obr-modal__msg is-error';
      } finally {
        statusSave.disabled = false;
        statusSave.textContent = 'Сохранить';
      }
    };

    // ============================================================
    // Утилиты
    // ============================================================
    function formatDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hh + ':' + mm;
    }

    function formatBirthDate(s) {
      if (!s) return '—';
      const p = String(s).split('-');
      if (p.length !== 3) return s;
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return parseInt(p[2], 10) + ' ' + m[parseInt(p[1], 10) - 1] + ' ' + p[0];
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        currentClaims = await getClaims(user);
      }
      if (obrData) render();
    });
  </script>
</body>
</html>
