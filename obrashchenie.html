<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обращение — Moscow RP</title>
  <link rel="icon" type="image/png" href="ikon.png">

  <style>
    .obr-view { max-width: 820px; margin: 0 auto; }

    .obr-view__back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; color: #666; text-decoration: none;
      margin-bottom: 24px;
    }
    .obr-view__back:hover { color: #111; }

    .obr-view__card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 36px 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .obr-view__head { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .obr-view__title {
      font-size: 24px; font-weight: 800; color: #111;
      margin: 0 0 10px; line-height: 1.3;
      text-transform: uppercase; letter-spacing: 0.01em;
    }
    .obr-view__date { font-size: 14px; color: #666; }
    .obr-view__status {
      display: inline-block;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 5px;
      text-transform: uppercase; letter-spacing: .04em;
      margin-left: 10px;
    }
    .obr-view__status--new { background: #fdecec; color: #b3261e; }
    .obr-view__status--progress { background: #fff8e6; color: #a68a2d; }
    .obr-view__status--answered { background: #eaf6ec; color: #1a6b31; }

    .obr-view__section { margin-bottom: 24px; }
    .obr-view__label {
      font-size: 11px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .obr-view__value {
      font-size: 15px; color: #111;
      line-height: 1.55;
    }
    .obr-view__value--tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #f4f6f9;
      border: 1px solid #e0e6ed;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    .obr-view__body {
      font-size: 16px; color: #222;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #fafafa;
      border-left: 3px solid #c9a24a;
      padding: 20px 24px;
      border-radius: 6px;
    }

    .obr-view__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 640px) { .obr-view__grid { grid-template-columns: 1fr; gap: 20px; } }

    .obr-view__footer {
      margin-top: 28px; padding-top: 20px;
      border-top: 1px solid #eee;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .obr-view__btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px; font-size: 14px; font-weight: 600;
      border-radius: 8px; cursor: pointer; text-decoration: none;
      border: none; font-family: inherit; transition: background .2s ease;
    }
    .obr-view__btn--ghost { background: #f4f4f4; color: #333; }
    .obr-view__btn--ghost:hover { background: #e8e8e8; }
    .obr-view__btn--danger { background: #fdecec; color: #b3261e; }
    .obr-view__btn--danger:hover { background: #f8d7d7; }

    .obr-view__empty {
      text-align: center; color: #999; padding: 80px 20px;
      font-size: 15px;
    }
    .obr-view__empty-title {
      font-size: 22px; font-weight: 700; color: #111;
      margin-bottom: 12px;
    }

    .obr-view__reply {
      margin-top: 24px;
      padding: 20px 24px;
      background: #eaf6ec;
      border-left: 3px solid #1a6b31;
      border-radius: 6px;
    }
    .obr-view__reply-label {
      font-size: 11px; font-weight: 700; color: #1a6b31;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .obr-view__reply-body {
      font-size: 15px; color: #111; line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="site-header__menu">
      <a href="fz.html" class="site-header__link">Федеральное законодательство</a>

      <a href="organizations.html" class="site-header__link">Организации</a>
      <a href="akty.html" class="site-header__link is-current">Обращения</a>
    </nav>
    <a href="index.html" class="site-header__title">Moscow RP</a>
    <div style="position:absolute;right:40px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:12px;z-index:20;">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span>Войти</span>
        </a>
        <a href="register.html" style="display:inline-flex;align-items:center;gap:7px;padding:8px 14px;font-size:13px;font-weight:600;color:#fff;background:#c9302c;border-radius:8px;text-decoration:none;white-space:nowrap;line-height:1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          <span>Регистрация</span>

      <a id="authProfile" href="profile.html" style="display:none;align-items:center;gap:7px;padding:8px 14px;font-size:13px;font-weight:600;color:#fff;background:#c9a24a;border-radius:8px;text-decoration:none;white-space:nowrap;line-height:1;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

      </a>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/></svg>
      </a>

  <main class="page">
    <div class="obr-view" id="obrView">
      <p style="text-align:center;color:#888;padding:60px 0;">Загрузка обращения…</p>
    </div>
  </main>

  <script type="module" src="js/auth-header.js?v=23"></script>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getClaims, canEdit } from "./js/permissions.js";

    const params = new URLSearchParams(window.location.search);
    const obrId = params.get('id');

    const obrView = document.getElementById('obrView');

    let currentUser = null;
    let currentClaims = { role: 'citizen', sections: [] };
    let obrData = null;

    if (!obrId) {
      obrView.innerHTML = '<div class="obr-view__empty"><div class="obr-view__empty-title">Обращение не найдено</div>Вернитесь к <a href="akty.html">списку организаций</a>.</div>';
    } else {
      loadObrashchenie();
    }

    async function loadObrashchenie() {
      try {
        const snap = await getDoc(doc(db, 'obrashcheniya', obrId));
        if (!snap.exists()) {
          obrView.innerHTML = '<div class="obr-view__empty"><div class="obr-view__empty-title">Обращение не найдено</div>Возможно, оно было удалено.</div>';
          return;
        }
        obrData = { id: obrId, ...snap.data() };
        render();
      } catch (e) {
        console.error(e);
        obrView.innerHTML = '<div class="obr-view__empty" style="color:#b3261e;">Ошибка загрузки обращения.</div>';
      }
    }

    function render() {
      const d = obrData;

      let statusHtml = '';
      if (d.status === 'progress') {
        statusHtml = '<span class="obr-view__status obr-view__status--progress">В работе</span>';
      } else if (d.status === 'answered') {
        statusHtml = '<span class="obr-view__status obr-view__status--answered">Отвечено</span>';
      } else {
        statusHtml = '<span class="obr-view__status obr-view__status--new">Новое</span>';
      }

      // Кто может менять статус / отвечать / удалять
      const canManage = currentClaims.role === 'admin'
        || currentClaims.role === 'government'
        || (d.orgSection ? canEdit(d.orgSection, currentClaims) : false);

      // Ссылка на вкладку организации
      const backHref = 'obrashcheniya-org.html?id=' + esc(d.orgId || '') + (d.orgTabId ? '&tab=' + esc(d.orgTabId) : '');

      // Блок вкладки
      const tabBlock = d.orgTabLabel
        ? `<div class="obr-view__value obr-view__value--tab">
             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
             ${esc(d.orgTabLabel)}
           </div>`
        : '';

      const replyHtml = d.reply && d.reply.trim()
        ? `<div class="obr-view__reply">
             <div class="obr-view__reply-label">Ответ организации</div>
             <div class="obr-view__reply-body">${esc(d.reply)}</div>
           </div>`
        : '';

      obrView.innerHTML = `
        <a href="${backHref}" class="obr-view__back">← Вернуться к организации</a>

        <div class="obr-view__card">
          <div class="obr-view__head">
            <h1 class="obr-view__title">${esc(d.title || 'Обращение')}${statusHtml}</h1>
            <div class="obr-view__date">Подано: ${formatDate(d.createdAt)}</div>
          </div>

          <div class="obr-view__grid">
            <div class="obr-view__section">
              <div class="obr-view__label">Кто подаёт</div>
              <div class="obr-view__value">${esc(d.authorName || '—')}</div>
            </div>
            <div class="obr-view__section">
              <div class="obr-view__label">Организация</div>
              <div class="obr-view__value">${esc(d.orgShortName || '—')}</div>
            </div>
            <div class="obr-view__section">
              <div class="obr-view__label">Серия и номер паспорта</div>
              <div class="obr-view__value">${esc(d.passport || '—')}</div>
            </div>
            <div class="obr-view__section">
              <div class="obr-view__label">Дата рождения</div>
              <div class="obr-view__value">${formatBirthDate(d.birthDate)}</div>
            </div>
          </div>

          ${d.orgTabLabel ? `
            <div class="obr-view__section">
              <div class="obr-view__label">Вкладка обращения</div>
              ${tabBlock}
            </div>
          ` : ''}

          <div class="obr-view__section">
            <div class="obr-view__label">Суть обращения</div>
            <div class="obr-view__body">${esc(d.body || '')}</div>
          </div>

          ${replyHtml}

          <div class="obr-view__footer">
            <a href="akty.html" class="obr-view__btn obr-view__btn--ghost">← К списку организаций</a>
            ${canManage ? `
              <button type="button" class="obr-view__btn obr-view__btn--ghost" id="statusBtn">
                Изменить статус
              </button>
              <button type="button" class="obr-view__btn obr-view__btn--ghost" id="replyBtn">
                Ответить
              </button>
              <button type="button" class="obr-view__btn obr-view__btn--danger" id="deleteBtn">
                Удалить
              </button>
            ` : ''}
          </div>
        </div>
      `;

      const statusBtn = document.getElementById('statusBtn');
      const replyBtn = document.getElementById('replyBtn');
      const deleteBtn = document.getElementById('deleteBtn');

      if (statusBtn) {
        statusBtn.onclick = async () => {
          const next = prompt(
            'Введите новый статус:\n' +
            'new — Новое\n' +
            'progress — В работе\n' +
            'answered — Отвечено',
            d.status || 'new'
          );
          if (!next) return;
          if (!['new','progress','answered'].includes(next)) {
            alert('Недопустимый статус.');
            return;
          }
          await updateDoc(doc(db, 'obrashcheniya', obrId), { status: next });
          obrData.status = next;
          render();
        };
      }

      if (replyBtn) {
        replyBtn.onclick = async () => {
          const reply = prompt('Введите текст ответа организации:', d.reply || '');
          if (reply === null) return;
          await updateDoc(doc(db, 'obrashcheniya', obrId), {
            reply: reply,
            repliedAt: new Date(),
            status: 'answered'
          });
          obrData.reply = reply;
          obrData.status = 'answered';
          render();
        };
      }

      if (deleteBtn) {
        deleteBtn.onclick = async () => {
          if (!confirm('Удалить это обращение? Действие необратимо.')) return;
          try {
            await deleteDoc(doc(db, 'obrashcheniya', obrId));
            window.location.href = backHref;
          } catch (e) { alert('Ошибка: ' + e.message); }
        };
      }
    }

    function formatDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hh + ':' + mm;
    }

    function formatBirthDate(s) {
      if (!s) return '—';
      const p = String(s).split('-');
      if (p.length !== 3) return s;
      const m = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      return parseInt(p[2], 10) + ' ' + m[parseInt(p[1], 10) - 1] + ' ' + p[0];
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        currentClaims = await getClaims(user);
      }
      if (obrData) render();
    });
  </script>
</body>
