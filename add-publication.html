<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая публикация — Moscow RP</title>
  <link rel="icon" type="image/png" href="ikon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://static.tildacdn.com">
  <link rel="stylesheet" href="https://static.tildacdn.com/css/tilda-fonts-1.0.min.css">
  <style>
    .pub-form { max-width: 620px; margin: 0 auto; padding: 32px 28px; background: #fafafa; border: 1px solid #e8e8e8; border-radius: 12px; }
    .pub-form__field { margin-bottom: 20px; }
    .pub-form__label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .pub-form__input, .pub-form__select { width: 100%; padding: 12px 14px; font-size: 15px; font-family: inherit; border: 1.5px solid #d8d8d8; border-radius: 8px; outline: none; box-sizing: border-box; background: #fff; color: #111; transition: border-color .2s ease; }
    .pub-form__input:focus, .pub-form__select:focus { border-color: #c9a24a; }
    .pub-form__hint { font-size: 12px; color: #999; margin-top: 6px; }
    .pub-form__file { display: block; width: 100%; padding: 14px; background: #fff; border: 1.5px dashed #c9a24a; border-radius: 8px; font-size: 14px; color: #666; cursor: pointer; box-sizing: border-box; }
    .pub-form__file::-webkit-file-upload-button { background: #c9a24a; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: inherit; margin-right: 12px; }
    .pub-form__preview { margin-top: 14px; max-width: 100%; max-height: 300px; border-radius: 8px; display: none; }
    .pub-form__preview.is-visible { display: block; }
    .pub-form__btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: #fff; background: #c9302c; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; transition: background .2s ease; margin-top: 8px; }
    .pub-form__btn:hover { background: #a82822; }
    .pub-form__btn:disabled { opacity: .6; cursor: not-allowed; }
    .pub-form__message { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 14px; display: none; }
    .pub-form__message.is-error { display: block; background: #fdecec; color: #b3261e; border: 1px solid #f3c0bd; }
    .pub-form__message.is-success { display: block; background: #eaf6ec; color: #1a6b31; border: 1px solid #b8dcbf; }
    .pub-form__progress { margin-top: 12px; height: 6px; background: #eee; border-radius: 4px; overflow: hidden; display: none; }
    .pub-form__progress.is-visible { display: block; }
    .pub-form__progress-bar { height: 100%; background: #c9a24a; width: 0; transition: width .3s ease; }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="site-header__menu">
      <a href="fz.html" class="site-header__link">Федеральное законодательство</a>
      <a href="gos.html" class="site-header__link">Государственное руководство</a>
      <a href="organizations.html" class="site-header__link">Организации</a>
      <a href="akty.html" class="site-header__link is-current">Акты</a>
    </nav>
    <a href="index.html" class="site-header__title">Moscow RP</a>
  </header>

  <main class="page">
    <header class="page__head">
      <h1 class="page__title">Новая публикация</h1>
      <p class="page__subtitle">Введите название, выберите раздел, орган и загрузите изображение</p>
    </header>

    <form class="pub-form" id="pubForm">
      <div class="pub-form__field">
        <label class="pub-form__label" for="title">Основное название</label>
        <input class="pub-form__input" type="text" id="title" placeholder="Например: Указ Президента Российской Федерации №4" required>
      </div>

      <div class="pub-form__field">
        <label class="pub-form__label" for="subtitle">О чём (второстепенное)</label>
        <input class="pub-form__input" type="text" id="subtitle" placeholder="Например: О назначении на должность" required>
      </div>

      <div class="pub-form__field">
        <label class="pub-form__label" for="section">Раздел</label>
        <select class="pub-form__select" id="section" required>
          <option value="">— выберите раздел —</option>
          <option value="ukazy">Указы Президента РФ</option>
          <option value="ap">Постановления Администрации Президента РФ</option>
          <option value="postanovleniya">Постановления Правительства РФ</option>
          <option value="zak-sobranie">Постановления Законодательного Собрания</option>
          <option value="cik">Постановления ЦИК РФ</option>
          <option value="sb">Акты Совета Безопасности РФ</option>
          <option value="mvd">Акты Министерства внутренних дел РФ</option>
          <option value="minoborony">Акты Министерства обороны РФ</option>
          <option value="minzdrav">Акты Министерства здравоохранения РФ</option>
          <option value="minust">Акты Министерства юстиции РФ</option>
          <option value="prokuratura">Акты Прокуратуры РФ</option>
          <option value="sk">Акты Следственного комитета РФ</option>
          <option value="regiony">Акты Региональных администраций</option>
          <option value="fsb">Акты Федеральной службы безопасности РФ</option>
          <option value="fsin">Акты Федеральной службы исполнения наказаний РФ</option>
          <option value="sudy">Акты судов РФ</option>
          <option value="ustavy">Уставы и положения о работе государственных органов</option>
        </select>
      </div>

      <div class="pub-form__field">
        <label class="pub-form__label" for="author">Публикуется от имени</label>
        <select class="pub-form__select" id="author" required>
          <option value="">— выберите орган —</option>
          <option value="Правительство Российской Федерации">Правительство Российской Федерации</option>
          <option value="Президент Российской Федерации">Президент Российской Федерации</option>
          <option value="Администрация Президента Российской Федерации">Администрация Президента Российской Федерации</option>
          <option value="Совет Федерации Федерального Собрания Российской Федерации">Совет Федерации Федерального Собрания РФ</option>
          <option value="Государственная Дума Федерального Собрания Российской Федерации">Государственная Дума Федерального Собрания РФ</option>
          <option value="Законодательное Собрание Российской Федерации">Законодательное Собрание РФ</option>
          <option value="Центральная избирательная комиссия Российской Федерации">Центральная избирательная комиссия РФ</option>
          <option value="Совет Безопасности Российской Федерации">Совет Безопасности Российской Федерации</option>
          <option value="Министерство внутренних дел Российской Федерации">Министерство внутренних дел РФ</option>
          <option value="Министерство обороны Российской Федерации">Министерство обороны РФ</option>
          <option value="Министерство здравоохранения Российской Федерации">Министерство здравоохранения РФ</option>
          <option value="Министерство юстиции Российской Федерации">Министерство юстиции РФ</option>
          <option value="Генеральная прокуратура Российской Федерации">Генеральная прокуратура РФ</option>
          <option value="Следственный комитет Российской Федерации">Следственный комитет РФ</option>
          <option value="Федеральная служба безопасности Российской Федерации">Федеральная служба безопасности РФ</option>
          <option value="Федеральная служба исполнения наказаний Российской Федерации">Федеральная служба исполнения наказаний РФ</option>
          <option value="Верховный Суд Российской Федерации">Верховный Суд РФ</option>
          <option value="Конституционный Суд Российской Федерации">Конституционный Суд РФ</option>
          <option value="__custom__">— другое (ввести вручную) —</option>
        </select>
      </div>

      <div class="pub-form__field" id="customAuthorField" style="display:none;">
        <label class="pub-form__label" for="customAuthor">Своё название органа</label>
        <input class="pub-form__input" type="text" id="customAuthor" placeholder="Например: Аппарат Правительства РФ">
      </div>

      <div class="pub-form__field">
        <label class="pub-form__label" for="image">Изображение документа</label>
        <input class="pub-form__file" type="file" id="image" accept="image/*" required>
        <img class="pub-form__preview" id="preview" alt="Предпросмотр">
      </div>

      <button class="pub-form__btn" type="submit" id="submitBtn">Опубликовать</button>

      <div class="pub-form__progress" id="progress"><div class="pub-form__progress-bar" id="progressBar"></div></div>
      <div class="pub-form__message" id="message"></div>
    </form>
  </main>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { canEdit, getClaims } from "./js/permissions.js";

    const CLOUDINARY_CLOUD_NAME = "uykb5ubk";
    const CLOUDINARY_UPLOAD_PRESET = "moscow_rp_uploads";

    const SECTION_TO_PAGE = {
      'ukazy':         'ukazy.html',
      'ap':            'ap.html',
      'postanovleniya':'postanovleniya.html',
      'zak-sobranie':  'zak-sobranie.html',
      'cik':           'cik.html',
      'sb':            'sb.html',
      'mvd':           'mvd.html',
      'minoborony':    'minoborony.html',
      'minzdrav':      'minzdrav.html',
      'minust':        'minust.html',
      'prokuratura':   'prokuratura.html',
      'sk':            'sk.html',
      'regiony':       'regiony.html',
      'fsb':           'fsb.html',
      'fsin':          'fsin.html',
      'sudy':          'sudy.html',
      'ustavy':        'ustavy.html'
    };

    function resolveRedirect(section) {
      if (SECTION_TO_PAGE[section]) return SECTION_TO_PAGE[section];
      const m = section.match(/^org-([a-zA-Z0-9]+)-(.+)$/);
      if (m) return 'organization.html?id=' + m[1];
      return 'akty.html';
    }

    const form = document.getElementById('pubForm');
    const titleInput = document.getElementById('title');
    const subtitleInput = document.getElementById('subtitle');
    const sectionSelect = document.getElementById('section');
    const authorSelect = document.getElementById('author');
    const customAuthorField = document.getElementById('customAuthorField');
    const customAuthorInput = document.getElementById('customAuthor');
    const imageInput = document.getElementById('image');
    const preview = document.getElementById('preview');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');

    const params = new URLSearchParams(window.location.search);

    authorSelect.addEventListener('change', () => {
      if (authorSelect.value === '__custom__') {
        customAuthorField.style.display = 'block';
        customAuthorInput.required = true;
      } else {
        customAuthorField.style.display = 'none';
        customAuthorInput.required = false;
        customAuthorInput.value = '';
      }
    });

    const presetSection = params.get('section');

    let currentUser = null;
    let currentClaims = { role: 'citizen', sections: [] };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      currentClaims = await getClaims(user);

      // ✅ Проверяем: может ли вообще кто-то из этой роли что-то публиковать
      // - admin: всё
      // - government: всё (мягкий фикс — пусть видят все разделы, rules сами ограничат)
      // - остальные: только свои sections
      const role = currentClaims.role || 'citizen';
      const sections = currentClaims.sections || [];

      const canPublishAnywhere = role === 'admin' || role === 'government' || sections.includes('*');

      // Фильтруем опции, если пользователь НЕ может публиковать везде
      if (!canPublishAnywhere) {
        Array.from(sectionSelect.options).forEach((opt) => {
          if (!opt.value) return;
          if (!canEdit(opt.value, currentClaims)) {
            opt.remove();
          }
        });
      }

      // Проверка: если после фильтрации не осталось доступных разделов
      if (sectionSelect.options.length <= 1) {
        showMessage('У вас нет прав на публикацию. Обратитесь к администрации.', 'error');
        submitBtn.disabled = true;
        return;
      }

      // Подставляем section из URL, если он доступен
      if (presetSection) {
        const opt = Array.from(sectionSelect.options).find(o => o.value === presetSection);
        if (opt) {
          sectionSelect.value = presetSection;
        } else if (canEdit(presetSection, currentClaims)) {
          const newOpt = document.createElement('option');
          newOpt.value = presetSection;
          newOpt.textContent = 'Раздел организации: ' + presetSection;
          sectionSelect.appendChild(newOpt);
          sectionSelect.value = presetSection;
        }
      }
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'pub-form__message ' + (type === 'error' ? 'is-error' : 'is-success');
    }

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.classList.add('is-visible');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) { showMessage('Вы не авторизованы.', 'error'); return; }

      const title = titleInput.value.trim();
      const subtitle = subtitleInput.value.trim();
      const section = sectionSelect.value;
      const authorValue = authorSelect.value === '__custom__'
        ? customAuthorInput.value.trim()
        : authorSelect.value;
      const file = imageInput.files[0];

      if (!title || !subtitle || !section || !authorValue || !file) {
        showMessage('Заполните все поля.', 'error');
        return;
      }
      if (!canEdit(section, currentClaims)) {
        showMessage('У вас нет прав на публикацию в этот раздел.', 'error');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showMessage('Файл больше 10 МБ.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Загрузка...';
      progress.classList.add('is-visible');
      progressBar.style.width = '0%';

      try {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const response = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/upload', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error((err.error && err.error.message) || 'Ошибка загрузки в Cloudinary');
        }

        const data = await response.json();
        const imageUrl = data.secure_url;
        progressBar.style.width = '100%';

        // Определяем orgSection, если публикация идёт в раздел организации
        let orgSection = '';
        const m = section.match(/^org-([a-zA-Z0-9]+)-(.+)$/);
        if (m) {
          try {
            const orgSnap = await getDoc(doc(db, 'organizations', m[1]));
            if (orgSnap.exists()) {
              orgSection = orgSnap.data().section || '';
            }
          } catch (e) { console.warn('Не удалось получить orgSection', e); }
        }

        await addDoc(collection(db, 'publications'), {
          title: title,
          subtitle: subtitle,
          imageUrl: imageUrl,
          section: section,
          orgSection: orgSection,
          author: authorValue,
          authorName: currentUser.displayName || (currentUser.email || '').split('@')[0],
          authorEmail: currentUser.email,
          authorUid: currentUser.uid,
          authorRole: currentClaims.role,
          createdAt: serverTimestamp()
        });

        showMessage('Готово! Перенаправление...', 'success');
        const redirect = resolveRedirect(section);
        setTimeout(() => { window.location.href = redirect; }, 1200);

      } catch (err) {
        console.error(err);
        showMessage('Ошибка: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Опубликовать';
        progress.classList.remove('is-visible');
      }
    });
  </script>
</body>
</html>
